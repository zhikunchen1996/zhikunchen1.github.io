name: Test citation updater

on:
  pull_request:
    paths:
      - .github/workflows/*citations.yml
      - bin/update_scholar_citations.py
      - tests/test_update_scholar_citations.py
      - requirements.txt

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Verify real scholarly import
        run: python -c 'from scholarly import scholarly; import bibtexparser.bibdatabase'
      - run: python -m unittest discover -s tests -v
