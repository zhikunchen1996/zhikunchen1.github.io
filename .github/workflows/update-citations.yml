name: Update Google Scholar Citations

on:
  schedule:
    # Monthly on day 1 at 00:17 UTC, off the busy hour boundary.
    - cron: "17 0 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-citations.yml
      - bin/update_scholar_citations.py
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: citations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Verify real scholarly import
        run: python -c 'from scholarly import scholarly; import bibtexparser.bibdatabase'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  update-citations:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Fetch citations (fail visibly and preserve old data on error)
        run: timeout 180 python bin/update_scholar_citations.py
      - name: Validate nonempty citation data
        run: |
          python - <<'PY'
          from datetime import datetime
          import yaml
          with open('_data/citations.yml') as f:
              data = yaml.safe_load(f)
          assert data['papers'], 'Citation data must contain publications'
          assert str(data['metadata']['last_updated']) == datetime.now().strftime('%Y-%m-%d')
          print(f"Validated {len(data['papers'])} publications")
          PY
      - name: Commit refreshed data
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add _data/citations.yml
          if ! git diff --staged --quiet; then
            git commit -m "Update Google Scholar citations"
            git push
          fi
